<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#09090b"/>
<title>Case Study — Oreoluwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://res.cloudinary.com"/>
<link rel="dns-prefetch" href="https://res.cloudinary.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#09090b;--bg2:#111113;--border:rgba(255,255,255,0.07);--text:#e4e4e7;--muted:#52525b;--muted2:#3f3f46;--link:#a1a1aa;--link-hov:#e4e4e7;--mono:"Geist Mono",monospace;--sans:"Geist",sans-serif;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
a:focus-visible,button:focus-visible{outline:2px solid var(--link-hov);outline-offset:2px;border-radius:4px;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;}
::selection{background:rgba(255,255,255,0.16);}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px clamp(20px,5vw,64px);
  background:rgba(9,9,11,0.72);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.back-link{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;
  color:var(--link);text-decoration:none;
  border:1px solid var(--border);border-radius:50%;
  transition:color 0.15s,border-color 0.15s,background 0.15s,transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
}
.back-link:hover{color:var(--link-hov);border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);transform:translateX(-2px);}
.back-link:active{transform:translateX(-2px) scale(0.9);}
.back-link svg{width:15px;height:15px;flex-shrink:0;transition:transform 0.15s ease;}
.back-link:hover svg{transform:translateX(-2px);}
.topbar-clock{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:12px;letter-spacing:0.01em;color:var(--muted);
  white-space:nowrap;
}
@keyframes csFadeUp{to{opacity:1;transform:translateY(0);}}

/* ---------- scroll-triggered reveal ---------- */
.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.reveal.in-view{opacity:1;transform:translateY(0);}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none;}
  .cs-title,.cs-tags,.cs-hero-img-wrap{animation:none;opacity:1;transform:none;}
}

/* ---------- layout ---------- */
.wrap{max-width:100%;margin:0 auto;padding:0 clamp(20px,5vw,64px);}
.wrap-wide{max-width:100%;margin:0 auto;padding:0 clamp(20px,5vw,64px);}

/* ---------- hero (centered, like the Shade UI reference) ---------- */
.cs-hero{padding:96px 0 40px;text-align:center;}
.cs-title{
  font-family:var(--sans);font-weight:700;
  font-size:clamp(32px,6.5vw,80px);line-height:1.05;letter-spacing:-0.03em;
  color:var(--text);margin-bottom:28px;
  opacity:0;transform:translateY(10px);
  animation:csFadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
}
.cs-tags{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;
  opacity:0;transform:translateY(10px);
  animation:csFadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.08s forwards;
}
.cs-tag{
  font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:9px 16px;
  transition:border-color 0.15s,background 0.15s;
}
.cs-tag:hover{border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.03);}

/* ---------- hero image ---------- */
.cs-hero-img-wrap{
  margin:56px 0 0;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--border);
  background:var(--bg2);
  opacity:0;
  animation:csFadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.16s forwards;
}
.cs-hero-img-wrap img{display:block;width:100%;height:auto;}

/* ---------- intro statement block ---------- */
.cs-intro{padding:64px 0 40px;}
.cs-intro-row{display:flex;align-items:flex-start;gap:20px;margin-bottom:40px;}
.cs-intro-row .cs-label{padding-top:10px;flex-shrink:0;width:64px;}
.cs-intro-heading{
  font-family:var(--sans);font-weight:700;
  font-size:clamp(24px,4vw,42px);line-height:1.18;letter-spacing:-0.02em;
  color:var(--text);max-width:920px;
}
.cs-label{
  font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);
}
.cs-divider{border-top:1px solid var(--border);margin-bottom:40px;}

/* ---------- details grid: body copy + sidebar ---------- */
.cs-details-grid{
  display:grid;grid-template-columns:1fr 1fr 260px;gap:48px;
  padding-bottom:64px;
}
.cs-details-col p{font-size:14.5px;line-height:1.85;color:#a1a1aa;}
.cs-details-col p + p{margin-top:16px;}
.cs-sidebar{display:flex;flex-direction:column;gap:26px;}
.cs-sidebar-block .cs-label{display:block;margin-bottom:10px;}
.cs-sidebar-block .cs-value{font-size:14px;color:var(--text);line-height:1.5;}
.cs-sidebar-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;filter:grayscale(1);}
.cs-sidebar-link{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--text);color:var(--bg);text-decoration:none;
  font-size:13px;font-weight:500;
  border-radius:999px;padding:10px 16px;
  transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1),opacity 0.15s;
}
.cs-sidebar-link:hover{opacity:0.88;transform:translateY(-1px);}
.cs-sidebar-link:active{transform:translateY(0) scale(0.96);}
.cs-sidebar-link svg{width:12px;height:12px;}
@media(max-width:900px){
  .cs-details-grid{grid-template-columns:1fr;gap:32px;}
}

/* ---------- supporting sections (Problem / Solution / Impact) ---------- */
.cs-body{padding:0 0 40px;}
.cs-section{margin-bottom:52px;padding-top:40px;border-top:1px solid var(--border);}
.cs-section:first-child{border-top:none;padding-top:0;}
.cs-section:last-child{margin-bottom:0;}
.cs-section .cs-label{display:block;margin-bottom:14px;}
.cs-section p{font-size:15px;line-height:1.85;color:#a1a1aa;max-width:820px;}
.cs-section p + p{margin-top:14px;}
.cs-placeholder{
  display:inline-block;margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--muted2);
  border:1px dashed var(--border);border-radius:6px;padding:6px 10px;
}
.cs-coming-soon{
  padding:64px 0 100px;
  text-align:center;
}
.cs-coming-soon .tag{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:12px;letter-spacing:0.04em;color:var(--muted);
  text-transform:uppercase;
  border:1px solid var(--border);border-radius:999px;
  padding:8px 18px;
}

/* ---------- stat grid ---------- */
.cs-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin-top:8px;
}
.cs-stat{background:var(--bg2);padding:22px 18px;}
.cs-stat .num{font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:-0.02em;color:var(--text);}
.cs-stat .label{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5;}
@media(max-width:640px){.cs-stats{grid-template-columns:repeat(2,1fr);}}

/* ---------- gallery ---------- */
.cs-gallery{display:flex;flex-direction:column;gap:16px;margin-top:8px;}
.cs-gallery img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--border);background:var(--bg2);}

/* ---------- footer nav ---------- */
.cs-footer{
  border-top:1px solid var(--border);
  padding:40px 0 80px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.cs-footer-link{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--link);text-decoration:none;
  font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--border);border-radius:999px;
  transition:color 0.15s,border-color 0.15s,background 0.15s,transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
}
.cs-footer-link:hover{color:var(--link-hov);border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.03);transform:translateY(-1px);}
.cs-footer-link:active{transform:translateY(0) scale(0.96);}

/* ---------- loading skeleton (in case JS content swap is visible) ---------- */
#csRoot{min-height:60vh;}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="/design/index.html" id="backLink" aria-label="Back to work">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>
  <span class="topbar-clock" id="topbarClock"><span id="topbarClockText">&nbsp;</span></span>
</div>

<div id="csRoot"></div>

<script>
  // ---------------------------------------------------------------
  // Placeholder case study data — titles + copy are stand-ins and
  // will be swapped for real project content later. Just update the
  // fields below (or add more entries) — the layout renders itself.
  //
  // Layout is modeled on a reference case-study page (big centered
  // title + outlined tag pills + full-bleed hero image, then an
  // INTRO statement, a background/sidebar detail grid, and further
  // labeled sections below).
  // ---------------------------------------------------------------
  var CASE_STUDIES = {
    "01": {
      title: "Simplifying community engagement and event discovery",
      tags: ["Product Design", "2026", "myKommune"],
      hero: "https://res.cloudinary.com/dmqyultl0/image/upload/v1786605156/Desktop_-_78_bzc8it.png",
      intro: {
        label: "Intro",

      },
      background: {
        label: "Background",
        paragraphs: [
          "myKommune is a community-driven platform built to help people, brands, and organizations connect, collaborate, and grow within shared spaces, both digitally and physically, by making participation, discovery, and engagement feel intuitive and purposeful. At its core, myKommune is designed to reduce friction in how communities are formed and sustained — whether around work, interests, culture, or shared goals — by providing a structured yet flexible environment where communication, events, resources, and relationships can coexist seamlessly.",
          "myKommune is a thoughtfully designed community platform that brings people together around shared interests, goals, and values, enabling meaningful interaction and sustained engagement in a way that feels natural and intentional. It's built to serve as a central hub where communities can organize conversations, host events, share resources, and foster collaboration without the fragmentation commonly found across multiple tools and platforms."
        ]
      },

        link: {label:"View on Behance", url:"https://www.behance.net/gallery/242100717/Simplifying-Community-Engagement-and-Event-Discovery"}
      },
      stats: [
        {num:"—", label:"Metric one"},
        {num:"—", label:"Metric two"},
        {num:"—", label:"Metric three"},
        {num:"—", label:"Metric four"}
      ],
      sections: [
        {heading:"Approach", body:"Designed with growth in mind, the focus was on creating a clear and consistent interface that makes discovering and hosting community events simple. Particular attention was given to event discovery and filtering, helping users quickly find events that match their interests, location, and availability — keeping the platform lightweight, approachable, and easy to navigate for both hosts and attendees."},
        {heading:"Goal", body:"The work explores how myKommune can make participation feel more natural and intentional, without adding unnecessary friction — designing a clearer, more intuitive way for people to discover, create, and engage with community-driven events."},
        {heading:"Status", body:"The product is still in development, so this is only a glimpse into the work so far — from defining the experience to shaping the product across its app and web platform. More to come as it takes shape."}
      ],
      // Real exported product screens still needed here — using a
      // placeholder-free single hero for now until clean assets (not
      // Behance-page screenshots) are ready to drop in.
      gallery: []
    },
    "05": {
      title: "Transforming how nightlife is discovered, managed, and experienced",
      tags: ["Product Design", "2026", "SortMyScene"],
      hero: "https://res.cloudinary.com/dmqyultl0/image/upload/f_auto,q_auto:best,w_2400/v1786385956/Desktop_-_259_satbns.png",
      comingSoon: true,
      intro: {
        label: "Intro",
        heading: "Redesigning SortMyScene into a more engaging event discovery and management platform, helping users discover experiences while giving venues better tools to drive attendance and loyalty."
      },
      background: {
        label: "Background",
        paragraphs: [
          "Placeholder background text — describe the context the project started from, and what prompted the redesign.",
          "Placeholder background text — describe the team, the collaboration, and what your specific responsibility was."
        ]
      },
      sidebar: {
        role: "Product Designer",
        timeline: "Placeholder — Present",
        link: {label:"Visit SortMyScene", url:"#"}
      },
      stats: [
        {num:"—", label:"Metric one"},

        {heading:"Impact", body:"Placeholder impact summary. What changed as a result — for users, the business, or the team?"}
      ],
      gallery: []
    },
    "06": {
      title: "Case Study 06",
      tags: ["Product Design", "2026"],
      hero: "https://res.cloudinary.com/dmqyultl0/image/upload/v1786566445/Desktop_-_262_3_grcjyt.png",
      intro: {
        label: "Intro",
        heading: "A short one- or two-line summary of the project goes here — what it was, who it was for, and the core problem it solved."
      },
      background: {
        label: "Background",
        paragraphs: [
          "Placeholder background text — describe the context the project started from, and what prompted it.",
          "Placeholder background text — describe the team, the collaboration, and what your specific responsibility was."
        ]
      },
      sidebar: {
        role: "Product Designer",
        timeline: "Placeholder — Present",
        link: {label:"Visit project", url:"#"}
      },
      stats: [
        {num:"—", label:"Metric one"},

        {num:"—", label:"Metric three"},
        {num:"—", label:"Metric four"}
      ],
      sections: [
        {heading:"Problem", body:"Placeholder problem statement. What wasn't working, and why did it matter?"},
        {heading:"Solution", body:"Placeholder solution summary. What did you design or build, and why that approach?"},
        {heading:"Impact", body:"Placeholder impact summary. What changed as a result — for users, the business, or the team?"}
      ],
      gallery: []
    }
  };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id') || '05';
    var data = CASE_STUDIES[id];
    var root = document.getElementById('csRoot');

    if(!data){
      root.innerHTML = '<div class="wrap" style="padding:120px 24px;text-align:center;">'+
        '<p style="font-family:var(--mono);font-size:12px;color:var(--muted);">Case study not found.</p>'+
        '</div>';
      return;
    }

    document.title = data.title + ' — Oreoluwa';

    var tagsHtml = (data.tags || []).map(function(t){
      return '<span class="cs-tag">'+ escapeHtml(t) +'</span>';
    }).join('');

    var sectionsHtml = data.sections.map(function(s){
      return '<div class="cs-section reveal">'+
        '<span class="cs-label">'+ escapeHtml(s.heading) +'</span>'+
        '<p>'+ escapeHtml(s.body) +'</p>'+
        '</div>';
    }).join('');

    var statsHtml = '<div class="cs-section reveal"><span class="cs-label">Numbers</span>'+
      '<div class="cs-stats">'+
      data.stats.map(function(s){
        return '<div class="cs-stat"><div class="num">'+ escapeHtml(s.num) +'</div><div class="label">'+ escapeHtml(s.label) +'</div></div>';
      }).join('')+
      '</div>'+
      '<span class="cs-placeholder">placeholder metrics — replace when real numbers are ready</span>'+
      '</div>';

    var galleryHtml = '';
    if(data.gallery && data.gallery.length){
      galleryHtml = '<div class="cs-gallery reveal">'+
        data.gallery.map(function(src){ return '<img src="'+src+'" alt="'+escapeHtml(data.title)+' detail"/>'; }).join('')+
        '</div>';
    }

    var sidebarHtml = '';
    if(data.sidebar){
      var sb = data.sidebar;
      sidebarHtml =
        '<div class="cs-sidebar">'+
          (sb.role ? '<div class="cs-sidebar-block"><span class="cs-label">Role</span><div class="cs-value">'+ escapeHtml(sb.role) +'</div></div>' : '')+
          (sb.timeline ? '<div class="cs-sidebar-block"><span class="cs-label">Timeline</span><div class="cs-value">'+ escapeHtml(sb.timeline) +'</div></div>' : '')+
          (sb.link ? '<div class="cs-sidebar-block"><span class="cs-label">Link</span><br/><a class="cs-sidebar-link" href="'+ sb.link.url +'" target="_blank" rel="noopener">'+ escapeHtml(sb.link.label) +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></a></div>' : '')+
        '</div>';
    }

    var detailsHtml = '';
    if(data.background){
      var bg = data.background;
      var half = Math.ceil(bg.paragraphs.length / 2);
      var col1 = bg.paragraphs.slice(0, half);
      var col2 = bg.paragraphs.slice(half);
      detailsHtml =
        '<div class="cs-details-grid reveal">'+
          '<div class="cs-details-col">'+
            '<span class="cs-label" style="display:block;margin-bottom:14px;">'+ escapeHtml(bg.label) +'</span>'+
            col1.map(function(p){ return '<p>'+ escapeHtml(p) +'</p>'; }).join('')+
          '</div>'+
          '<div class="cs-details-col" style="padding-top:29px;">'+
            col2.map(function(p){ return '<p>'+ escapeHtml(p) +'</p>'; }).join('')+
          '</div>'+
          sidebarHtml +
        '</div>';
    }

    var introHtml = '';
    if(data.intro){
      introHtml =
        '<div class="cs-intro">'+
          '<div class="cs-intro-row reveal">'+
            '<span class="cs-label">'+ escapeHtml(data.intro.label) +'</span>'+
            '<h2 class="cs-intro-heading">'+ escapeHtml(data.intro.heading) +'</h2>'+
          '</div>'+
          '<div class="cs-divider"></div>'+
          detailsHtml +
        '</div>';
    }

    // While a case study is still being written up, we skip straight to a
    // "coming soon" notice right after the hero image. The intro/detail/
    // section/stat/gallery/footer markup above is left fully intact and
    // unused — flip `comingSoon` to false (or remove it) in the data
    // object above and this same layout renders in full again.
    var bodyHtml;
    if(data.comingSoon){
      bodyHtml =
        '<div class="cs-coming-soon reveal">'+
          '<span class="tag">Full case study coming soon</span>'+
        '</div>';
    } else {
      bodyHtml =
        introHtml +
        '<div class="cs-body">'+
          sectionsHtml +
          statsHtml +
          galleryHtml +
        '</div>'+
        '<div class="cs-footer reveal">'+
          '<a class="cs-footer-link" href="/design/index.html">&larr; Back to all work</a>'+
          '<a class="cs-footer-link" href="mailto:hello@isaacoreoluwa.xyz">Get in touch &rarr;</a>'+
        '</div>';
    }

    root.innerHTML =
      '<div class="wrap">'+
        '<div class="cs-hero">'+
          '<h1 class="cs-title">'+ escapeHtml(data.title) +'</h1>'+
          '<div class="cs-tags">'+ tagsHtml +'</div>'+
        '</div>'+
      '</div>'+
      '<div class="wrap-wide">'+
        '<div class="cs-hero-img-wrap"><img src="'+ data.hero +'" alt="'+ escapeHtml(data.title) +'"/></div>'+
      '</div>'+
      '<div class="wrap">'+
        bodyHtml +
      '</div>';
  }

  function initScrollReveal(){
    var items = document.querySelectorAll('.reveal');
    if(!items.length) return;
    if(!('IntersectionObserver' in window)){
      items.forEach(function(el){ el.classList.add('in-view'); });
      return;
    }
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -60px 0px'});
    items.forEach(function(el){ observer.observe(el); });
  }

  function updateClock(){
    var el = document.getElementById('topbarClockText');
    if(!el) return;
    var now = new Date();
    var datePart = now.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    var timePart = now.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
    el.textContent = datePart + ' \u00B7 ' + timePart;
  }
  updateClock();
  setInterval(updateClock, 1000);

  render();
  initScrollReveal();
</script>

</body>
</html>
